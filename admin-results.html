<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Resultados del concurso — Sistema de Puntaje">
    <title>Concurso — Resultados</title>
    <link rel="stylesheet" href="/src/views/css/global.css">
    <link rel="stylesheet" href="/src/views/css/components.css">
    <link rel="stylesheet" href="/src/views/css/admin.css">
</head>

<body>
    <div class="page-wrapper">
        <nav class="navbar" id="navbar"></nav>

        <main class="page-content">
            <div class="container">
                <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: var(--space-md);">
                    <div>
                        <h1>Resultados del Concurso</h1>
                        <p>Ranking general con sumatoria de puntajes — Top 5 ganadores por categoría</p>
                    </div>
                    <button class="btn btn-primary" id="btnFinalizeContest">Finalizar Concurso</button>
                </div>

                <!-- Filtro por categoría: select + botón -->
                <div class="results-filter" id="categoryFilter" style="display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap; margin-bottom: var(--space-md);">
                    <label for="categorySelect" style="font-weight: 600; white-space: nowrap;">Filtrar por categoría:</label>
                    <select id="categorySelect" class="form-control" style="max-width: 220px;">
                        <option value="all">Todas las categorías</option>
                        <option value="infantil">Infantil</option>
                        <option value="juvenil">Juvenil</option>
                        <option value="adulto">Adulto</option>
                    </select>
                </div>

                <!-- Tabla de resultados -->
                <div class="card">
                    <div id="resultsTable">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/src/views/admin-results.js"></script>
</body>

</html>
