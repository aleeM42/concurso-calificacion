<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calificar obras — Sistema de Puntaje de Concursos">
    <title>Concurso — Calificar</title>
    <link rel="stylesheet" href="/src/views/css/global.css">
    <link rel="stylesheet" href="/src/views/css/components.css">
    <link rel="stylesheet" href="/src/views/css/judge.css">
</head>

<body>
    <div class="page-wrapper">
        <nav class="navbar" id="navbar"></nav>

        <main class="page-content">
            <div class="container">
                <div class="page-header">
                    <h1>Calificar Obras</h1>
                    <p>Asigna un puntaje del 0 al 10 a cada obra</p>
                </div>

                <!-- Filtros -->
                <div class="filters-section card" style="margin-bottom: var(--space-xl); padding: var(--space-md); display: flex; gap: var(--space-md); align-items: center; flex-wrap: wrap;">
                    <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 200px;">
                        <input type="text" id="searchInput" class="form-control" placeholder="Buscar por autor o título...">
                    </div>
                    <div class="form-group" style="margin-bottom: 0; min-width: 150px;">
                        <select id="categoryFilter" class="form-control">
                            <option value="">Todas las categorías</option>
                            <option value="infantil">Infantil</option>
                            <option value="juvenil">Juvenil</option>
                            <option value="adulto">Adulto</option>
                        </select>
                    </div>
                </div>

                <!-- Progreso -->
                <div class="scoring-progress" id="progressBar" style="display: none;">
                    <span class="progress-text" id="progressText">0 / 0</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                    </div>
                </div>

                <!-- Cards de obras -->
                <div id="scoringContent">
                    <div class="spinner"></div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/src/views/judge-scoring.js"></script>
</body>

</html>
