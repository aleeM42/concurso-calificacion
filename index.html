<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema de Puntaje de Concursos — Inicio de sesión">
  <title>Concurso — Iniciar Sesión</title>
  <link rel="stylesheet" href="/src/views/css/global.css">
  <link rel="stylesheet" href="/src/views/css/components.css">
  <link rel="stylesheet" href="/src/views/css/login.css">
</head>

<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <img src="public/logo.png" alt="Fundación Carlos Stohr" class="brand-logo" id="brandLogo">
        <h1 class="brand-title">Aplicación para veredictos de concursos</h1>
        <p class="login-subtitle">Fundación Carlos Stohr</p>
      </div>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="userId">ID de Acceso</label>
          <input type="text" id="userId" class="form-control" placeholder="Ej: admin o juez1" required
            autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required
            autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btnLogin">
          Iniciar Sesión
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="/src/views/login.js"></script>
</body>

</html>
