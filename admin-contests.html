<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Historial de concursos — Sistema de Puntaje">
    <title>Concurso — Historial</title>
    <link rel="stylesheet" href="/src/views/css/global.css">
    <link rel="stylesheet" href="/src/views/css/components.css">
    <link rel="stylesheet" href="/src/views/css/admin.css">
    <style>
        .contest-card {
            background: var(--bg-color);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            margin-bottom: var(--space-xl);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }
        .contest-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-lg);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: var(--space-md);
        }
        .contest-title {
            margin: 0;
            color: var(--primary-color);
            font-size: var(--font-size-xl);
        }
        .contest-date {
            color: var(--text-muted);
            font-size: var(--font-size-sm);
        }
        .winner-category {
            margin-bottom: var(--space-lg);
        }
        .winner-category h4 {
            color: var(--text-color);
            text-transform: capitalize;
            margin-bottom: var(--space-sm);
            font-size: var(--font-size-md);
            display: inline-block;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 2px;
        }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <nav class="navbar" id="navbar"></nav>

        <main class="page-content">
            <div class="container">
                <div class="page-header">
                    <h1>Historial de Concursos</h1>
                    <p>Registro histórico de los veredictos (Top 5 ganadores) de concursos pasados</p>
                </div>

                <div id="contestsContainer">
                    <div class="spinner"></div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/src/views/admin-contests.js"></script>
</body>

</html>
